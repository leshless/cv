name: Build and publish CV

on:
  push:
    branches:
      - main
      
    paths:
      - "cv.typ"
      - "photo.jpg"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build CV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.0"

      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Compile CV
        run: typst compile cv.typ build/cv.pdf

      - name: Create CV image
        run: pdftoppm -png -singlefile -r 200 build/cv.pdf build/cv

      - name: Upload CV as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CV
          path: build
          if-no-files-found: error
          retention-days: 90

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: Publish CV
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4